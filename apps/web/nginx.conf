# __API_ORIGIN__ is replaced at image build time with the origin of
# VITE_API_URL (see Dockerfile), the only place the app talks to.

# One Cache-Control per response. It lives in a map because an add_header
# inside a location would silently drop every server-level header below.
map $uri $novaspin_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";  # hashed build output never changes
  default     "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Nothing here accepts uploads.
  client_max_body_size 1k;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Only our own scripts and styles (plus Google Fonts), API calls only to the
  # API, no framing, no plugins. Blocks injected scripts even if a bug let
  # one into the page.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Ignored over plain HTTP; applies once a TLS proxy serves the site.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # A demo shouldn't show up in search results next to real casinos.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control $novaspin_cache_control always;

  location /assets/ {
    try_files $uri =404;
  }

  # No dotfiles (.env, .git, …) even if one ever lands in the build output.
  location ~ /\. {
    return 404;
  }

  # Client-side routes (/lobby, /play/…, /settings) all serve the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
