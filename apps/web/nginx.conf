# Serves the built web app and proxies /api to the API, so the browser only
# ever talks to one origin: the session cookie can be SameSite=Strict, there's
# no CORS to get wrong, and the API itself is never exposed to the internet.
# The __PLACEHOLDERS__ are filled at image build time by render-nginx-conf.sh.

upstream novaspin_api {
  server __API_UPSTREAM__;
  keepalive 16;
}

# One Cache-Control per response. It lives in a map because an add_header
# inside a location would silently drop every server-level header below.
# Only real hits are cached for a year: a 404 for a not-yet-deployed asset
# must never stick in a CDN.
map "$status:$uri" $novaspin_cache_control {
  "~^(200|304):/assets/"  "public, max-age=31536000, immutable";  # hashed build output never changes
  default                 "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Redirects stay relative: never echo the Host header or leak the port.
  absolute_redirect off;

  # Proxies allowed to tell us the visitor's IP (TRUSTED_PROXIES build arg);
  # empty means visitors connect to us directly and X-Forwarded-For is ignored.
  __REAL_IP_CONFIG__

  # Slow-client protection: drop connections that dribble headers or bodies.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 30s;
  # Static files take no uploads; /api allows the API's own 16 KB limit.
  client_max_body_size 1k;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Everything comes from this origin: our scripts, styles, fonts and API.
  # No inline scripts, no third parties, no framing, no plugins.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # Ignored over plain HTTP; applies once a TLS proxy serves the site.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # A demo shouldn't show up in search results next to real casinos.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control $novaspin_cache_control always;

  # ^~ so no regex location (like the dotfile rule) can take over API paths.
  location ^~ /api/ {
    client_max_body_size 16k;
    proxy_pass http://novaspin_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, never appended: the API trusts exactly this one hop, so
    # whatever X-Forwarded-For a visitor sends can't fake their IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    # The API sends its own (stricter) security headers; this add_header just
    # stops the page headers above from being added on top.
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # No dotfiles (.env, .git, …) even if one ever lands in the build output.
  location ~ /\. {
    return 404;
  }

  # Client-side routes (/lobby, /play/…, /settings) all serve the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
